<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">布告欄表單</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="mb-3">
        <h2 th:text="${pageTitle}">新增公布訊息</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <!--相當於action="/bulletins POST" 整個 form 綁定到 bulletinForm 這個物件-->
            <form th:action="@{${formAction}}" th:object="${bulletinForm}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label">標題</label>
                    <!--Thymeleaf 會變成<input name="title" value="...">-->
                    <!--th:field="*{title}" = bulletinForm.title-->
                    <input type="text" id="title" th:field="*{title}" class="form-control">
                    <!--@Valid會觸發BulletinForm內部寫的@NotBlank與@NotNull驗證 若驗證失敗 fields.hasErrors就會觸發-->
                    <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <div class="mb-3">
                    <label for="publisher" class="form-label">公布者</label>
                    <input type="text" id="publisher" th:field="*{publisher}" class="form-control">
                    <div class="text-danger" th:if="${#fields.hasErrors('publisher')}" th:errors="*{publisher}"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="publishDate" class="form-label">發佈日期</label>
                        <input type="date" id="publishDate" th:field="*{publishDate}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('publishDate')}" th:errors="*{publishDate}"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="expireDate" class="form-label">截止日期</label>
                        <input type="date" id="expireDate" th:field="*{expireDate}" class="form-control">
                        <div class="text-danger" th:if="${#fields.hasErrors('expireDate')}" th:errors="*{expireDate}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">公布內容</label>
                    <textarea id="content" th:field="*{content}" rows="6" class="form-control"></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                </div>

                <div class="alert alert-danger" th:if="${dateError}" th:text="${dateError}"></div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">儲存</button>
                    <a th:href="@{/bulletins}" class="btn btn-secondary">返回列表</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
