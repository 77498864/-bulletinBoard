<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>布告欄列表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>布告欄列表</h2>
        <a th:href="@{/bulletins/new}" class="btn btn-primary">新增公布訊息</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-bordered table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>標題</th>
                    <th>發佈日期</th>
                    <th>截止日期</th>
                    <th style="width: 180px;">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(bulletinList)}">
                    <td colspan="4" class="text-center">目前沒有資料</td>
                </tr>
                <tr th:each="item : ${bulletinList}">
                    <td th:text="${item.title}">標題</td>
                    <td th:text="${item.publishDate}">2026-03-24</td>
                    <td th:text="${item.expireDate}">2026-03-31</td>
                    <td>
                        <a th:href="@{/bulletins/{id}/edit(id=${item.id})}" class="btn btn-sm btn-warning">修改</a>
                        <form th:action="@{/bulletins/{id}/delete(id=${item.id})}" method="post" class="d-inline delete-form">
                            <button type="submit" class="btn btn-sm btn-danger">刪除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/bulletins(page=${currentPage - 1})}">上一頁</a>
                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/bulletins(page=${i})}"
                           th:text="${i}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/bulletins(page=${currentPage + 1})}">下一頁</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/bulletin.js}"></script>
</body>
</html>
